name: Robot de noticias InfoPresidencia
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  noticias:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/robot-noticias.mjs
      - name: Guardar cambios
        run: |
          git config user.name "robot-vibras"
          git config user.email "robot@users.noreply.github.com"
          git add data/noticias.json og.jpg || true
          git diff --cached --quiet || git commit -m "Noticias al día $(TZ=America/Bogota date '+%Y-%m-%d %H:%M')"
          git push
